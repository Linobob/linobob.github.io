<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SCOTOGNO Soccer - partita a due</title>
<style>
  :root { --bg:#101218; --pan:#1c2029; --tx:#e9e9ec; --dim:#9aa0ab; --acc:#e0b341; --ok:#4fc36b; --err:#e5534b; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.4 system-ui, sans-serif; }
  body { min-height:100vh; }
  main { max-width:760px; margin:0 auto; padding:10px; }
  h1 { font-size:20px; margin:6px 0; letter-spacing:.5px; }
  h1 b { color:var(--acc); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:8px; }
  section { background:var(--pan); border-radius:10px; padding:12px; margin:10px 0; }
  h2 { font-size:16px; margin:0 0 8px; }
  .riga { display:flex; align-items:center; gap:8px; margin:7px 0; flex-wrap:wrap; }
  .riga > label { flex:0 0 130px; color:var(--dim); }
  select, input[type=password], input[type=text] { font:inherit; background:#0d0f14; color:var(--tx);
    border:1px solid #3a3f4b; border-radius:6px; padding:7px; min-width:170px; }
  .scelta { display:inline-flex; border:1px solid #3a3f4b; border-radius:7px; overflow:hidden; }
  .scelta button { margin:0; border-radius:0; background:#2a2f3a; padding:7px 11px; }
  .scelta button.on { background:#3a64c8; }
  button { font:inherit; padding:9px 14px; margin:3px 4px 3px 0; border:0; border-radius:8px; background:#3a64c8;
    color:#fff; cursor:pointer; }
  button.sec { background:#454b58; }
  button.big { font-size:19px; padding:12px 26px; background:#2f9e4d; }
  .nota { color:var(--dim); font-size:13px; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hide { display:none !important; }
  #schermo { position:relative; background:#000; border-radius:6px; padding:14px 18px; }
  #tela { display:block; width:100%; aspect-ratio:320/192; image-rendering:pixelated; image-rendering:crisp-edges; }
  #sopra { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(0,0,0,.72); text-align:center; padding:10px; }
  #sopra .grande { font-size:26px; font-weight:700; margin-bottom:6px; }
  #barra { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #tocco { display:flex; justify-content:space-between; align-items:center; margin-top:10px; user-select:none;
    -webkit-user-select:none; touch-action:none; }
  #croce { width:150px; height:150px; border-radius:50%; background:#232835; position:relative; touch-action:none; }
  #croce::before { content:""; position:absolute; inset:45px; border-radius:50%; background:#2e3443; }
  #fuoco { width:110px; height:110px; border-radius:50%; background:#a33; color:#fff; font-weight:700; font-size:18px;
    display:flex; align-items:center; justify-content:center; touch-action:none; }
  #fuoco.on { background:#e44; } #croce.on::before { background:#566; }
  table.tasti { border-collapse:collapse; font-size:14px; }
  table.tasti td { padding:2px 10px 2px 0; }
  textarea { width:100%; height:70px; background:#0d0f14; color:var(--tx); border:1px solid #3a3f4b; border-radius:6px;
    font:11px/1.3 ui-monospace, monospace; padding:6px; word-break:break-all; }
  #chatLista { height:140px; overflow-y:auto; background:#0d0f14; border:1px solid #3a3f4b; border-radius:6px; padding:6px;
    font-size:14px; margin-bottom:6px; }
  #chatLista div { margin:2px 0; word-wrap:break-word; } #chatLista .io { color:#9cc4ff; } #chatLista .lui { color:#ffd27a; }
  #chatLista .sis { color:var(--dim); font-style:italic; }
  .chatRiga { display:flex; gap:6px; } .chatRiga input { flex:1; min-width:0; }
  select:disabled, .scelta.ferma button { opacity:.55; pointer-events:none; }
  .pronto { font-weight:700; } .pronto.si { color:var(--ok); } .pronto.no { color:var(--dim); }
  #gioco #chatBox { margin-top:10px; }
  #barra select { min-width:0; padding:8px; }
  @media (min-width: 900px) {
    main.largo { max-width:1500px; }
    #gioco.lato { display:flex; gap:14px; align-items:stretch; }
    #gioco.lato.sinistra #chatGioco { order:-1; }
    #gioco.lato #colGioco { flex:1 1 auto; min-width:0; max-width:calc((100vh - 130px) * 320 / 192 + 36px); }
    #gioco.lato #chatGioco { flex:0 0 330px; display:flex; flex-direction:column; }
    #gioco.lato #chatBox { margin-top:0; flex:1; display:flex; flex-direction:column; background:var(--pan);
      border-radius:10px; padding:10px; }
    #gioco.lato #chatLista { flex:1; height:auto; min-height:120px; }
  }
  kbd { background:#2a2f3a; border-radius:4px; padding:1px 6px; font-family:inherit; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1><b>SCOTOGNO</b> Soccer <span data-t="titolo"></span></h1>
  <div class="sub" data-t="sottotitolo"></div>

  <div id="salaAttesa">
    <section>
      <div class="riga"><label data-t="modo"></label><span class="scelta" id="sModo"></span></div>
    </section>

    <section id="online" class="hide">
      <div class="riga"><label data-t="tuoNome"></label><input type="text" id="nome" maxlength="16" autocomplete="nickname"></div>
      <div id="collega">
        <h2 data-t="collegamento"></h2>
        <div class="riga"><span class="scelta" id="sRuolo"></span></div>
        <label class="riga"><input type="checkbox" id="stun" checked> <span data-t="usaStun"></span></label>
        <div id="pCrea">
          <button id="bCrea" data-t="creaCodice"></button>
          <textarea id="tOffer" readonly></textarea>
          <button class="sec" id="cOffer" data-t="copia"></button><button class="sec" id="sOffer" data-t="condividi"></button>
          <p class="nota" data-t="incollaRisposta"></p>
          <textarea id="tAnswerIn"></textarea>
          <button id="bCollega" data-t="collegaBtn"></button>
        </div>
        <div id="pEntra" class="hide">
          <p class="nota" data-t="incollaCodice"></p>
          <textarea id="tOfferIn"></textarea>
          <button id="bRisp" data-t="rispondi"></button>
          <p class="nota" data-t="rimanda"></p>
          <textarea id="tAnswer" readonly></textarea>
          <button class="sec" id="cAnswer" data-t="copia"></button><button class="sec" id="sAnswer" data-t="condividi"></button>
        </div>
      </div>
      <div id="collegati" class="hide">
        <h2 data-t="collegati"></h2>
        <div class="riga" id="ruoli"></div>
        <div class="riga nota" id="rete"></div>
        <div class="riga"><button class="sec" id="bScambia" data-t="scambia"></button><button class="sec" id="bScollega" data-t="scollega"></button></div>
      </div>
      <p class="nota" id="statoRete"></p>
    </section>

    <section>
      <h2 data-t="sala"></h2>
      <div class="riga"><label data-t="lingua"></label><span class="scelta" id="sLang"></span></div>
      <div class="riga"><label>PL1</label><select id="sP1"></select></div>
      <div class="riga"><label>PL2</label><select id="sP2"></select></div>
      <div class="riga"><label data-t="campo"></label><span class="scelta" id="sField"></span></div>
      <div class="riga"><label data-t="scivolata"></label><span class="scelta" id="sSlide"></span></div>
      <div class="riga"><label data-t="abilita"></label><span class="scelta" id="sAbil"></span></div>
      <div class="riga"><label data-t="powerup"></label><span class="scelta" id="sPu"></span></div>
      <div class="riga"><label data-t="giocatori"></label><span class="scelta" id="sSpr"></span></div>
      <div id="extra" class="hide">
        <div class="riga"><label data-t="battuta"></label><span class="scelta" id="sKick"></span></div>
        <div class="riga"><label data-t="scivnuova"></label><span class="scelta" id="sCopt"></span></div>
        <div class="riga"><label data-t="pallone"></label><span class="scelta" id="sBall"></span></div>
      </div>
      <div class="riga" style="margin-top:14px"><button class="big" id="bGioca" data-t="gioca"></button>
        <span id="pronti" class="nota"></span></div>
    </section>

    <section id="chatSala" class="hide"></section>

    <section>
      <h2 data-t="comandi"></h2>
      <table class="tasti">
        <tr><td>PL1</td><td data-t="tastiPL1"></td></tr>
        <tr><td>PL2</td><td data-t="tastiPL2"></td></tr>
      </table>
      <p class="nota" data-t="notaComandi"></p>
    </section>

    <section>
      <h2 data-t="segreti"></h2>
      <div class="riga"><input type="password" id="pw" autocomplete="off"><button class="sec" id="bPw" data-t="sblocca"></button></div>
      <div class="nota" id="pwStato"></div>
    </section>
  </div>

  <div id="gioco" class="hide">
   <div id="colGioco">
    <div id="schermo">
      <canvas id="tela" width="320" height="192"></canvas>
      <div id="sopra" class="hide"></div>
    </div>
    <div id="barra">
      <button class="sec" id="bEsci" data-t="esci"></button>
      <button class="sec" id="bAudio"></button>
      <button class="sec" id="bFull" data-t="schermoIntero"></button>
      <select id="sChat" class="hide" title="Chat"></select>
      <span class="nota" id="info" style="align-self:center"></span>
    </div>
    <div id="attesa" class="nota"></div>
    <div id="tocco" class="hide">
      <div id="croce"></div>
      <div id="fuoco">FIRE</div>
    </div>
   </div>
    <div id="chatGioco"></div>
  </div>
  <div id="chatBox" class="hide">
    <h2 data-t="chat"></h2>
    <div id="chatLista"></div>
    <div class="chatRiga"><input type="text" id="chatIn" maxlength="200" autocomplete="off"><button id="bChat" data-t="manda"></button></div>
  </div>
  <p class="nota" data-t="piede"></p>
</main>

      case 0xb6: cpu.x = nz(rd(zpy())); break;
      case 0xae: cpu.x = nz(rd(abs())); break;
      case 0xbe: cpu.x = nz(rd(absy())); break;
      case 0xa0: cpu.y = nz(rd(imm())); break;
      case 0xa4: cpu.y = nz(rd(zp())); break;
      case 0xb4: cpu.y = nz(rd(zpx())); break;
      case 0xac: cpu.y = nz(rd(abs())); break;
      case 0xbc: cpu.y = nz(rd(absx())); break;
      case 0x85: wr(zp(), cpu.a); break;
      case 0x95: wr(zpx(), cpu.a); break;
      case 0x8d: wr(abs(), cpu.a); break;
      case 0x9d: wr(absx(), cpu.a); break;
      case 0x99: wr(absy(), cpu.a); break;
      case 0x81: wr(indx(), cpu.a); break;
      case 0x91: wr(indy(), cpu.a); break;
      case 0x86: wr(zp(), cpu.x); break;
      case 0x96: wr(zpy(), cpu.x); break;
      case 0x8e: wr(abs(), cpu.x); break;
      case 0x84: wr(zp(), cpu.y); break;
      case 0x94: wr(zpx(), cpu.y); break;
      case 0x8c: wr(abs(), cpu.y); break;
      // --- trasferimenti
      case 0xaa: cpu.x = nz(cpu.a); break;
      case 0xa8: cpu.y = nz(cpu.a); break;
      case 0x8a: cpu.a = nz(cpu.x); break;
      case 0x98: cpu.a = nz(cpu.y); break;
      case 0xba: cpu.x = nz(cpu.sp); break;
      case 0x9a: cpu.sp = cpu.x; break;
      // --- pila
      case 0x48: push(cpu.a); break;
      case 0x68: cpu.a = nz(pop()); break;
      case 0x08: push(cpu.p | B | U); break;
      case 0x28: cpu.p = pop() | B | U; break;
      // --- logica e aritmetica
      case 0x29: cpu.a = nz(cpu.a & rd(imm())); break;
      case 0x25: cpu.a = nz(cpu.a & rd(zp())); break;
      case 0x35: cpu.a = nz(cpu.a & rd(zpx())); break;
      case 0x2d: cpu.a = nz(cpu.a & rd(abs())); break;
      case 0x3d: cpu.a = nz(cpu.a & rd(absx())); break;
      case 0x39: cpu.a = nz(cpu.a & rd(absy())); break;
      case 0x21: cpu.a = nz(cpu.a & rd(indx())); break;
      case 0x31: cpu.a = nz(cpu.a & rd(indy())); break;
      case 0x09: cpu.a = nz(cpu.a | rd(imm())); break;
      case 0x05: cpu.a = nz(cpu.a | rd(zp())); break;
      case 0x15: cpu.a = nz(cpu.a | rd(zpx())); break;
      case 0x0d: cpu.a = nz(cpu.a | rd(abs())); break;
      case 0x1d: cpu.a = nz(cpu.a | rd(absx())); break;
      case 0x19: cpu.a = nz(cpu.a | rd(absy())); break;
      case 0x01: cpu.a = nz(cpu.a | rd(indx())); break;
      case 0x11: cpu.a = nz(cpu.a | rd(indy())); break;
      case 0x49: cpu.a = nz(cpu.a ^ rd(imm())); break;
      case 0x45: cpu.a = nz(cpu.a ^ rd(zp())); break;
      case 0x55: cpu.a = nz(cpu.a ^ rd(zpx())); break;
      case 0x4d: cpu.a = nz(cpu.a ^ rd(abs())); break;
      case 0x5d: cpu.a = nz(cpu.a ^ rd(absx())); break;
      case 0x59: cpu.a = nz(cpu.a ^ rd(absy())); break;
      case 0x41: cpu.a = nz(cpu.a ^ rd(indx())); break;
      case 0x51: cpu.a = nz(cpu.a ^ rd(indy())); break;
      case 0x69: adc(rd(imm())); break;
      case 0x65: adc(rd(zp())); break;
      case 0x75: adc(rd(zpx())); break;
      case 0x6d: adc(rd(abs())); break;
      case 0x7d: adc(rd(absx())); break;
      case 0x79: adc(rd(absy())); break;
      case 0x61: adc(rd(indx())); break;
      case 0x71: adc(rd(indy())); break;
      case 0xe9: sbc(rd(imm())); break;
      case 0xe5: sbc(rd(zp())); break;
      case 0xf5: sbc(rd(zpx())); break;
      case 0xed: sbc(rd(abs())); break;
      case 0xfd: sbc(rd(absx())); break;
      case 0xf9: sbc(rd(absy())); break;
      case 0xe1: sbc(rd(indx())); break;
      case 0xf1: sbc(rd(indy())); break;
      case 0xc9: cmp(cpu.a, rd(imm())); break;
      case 0xc5: cmp(cpu.a, rd(zp())); break;
      case 0xd5: cmp(cpu.a, rd(zpx())); break;
      case 0xcd: cmp(cpu.a, rd(abs())); break;
      case 0xdd: cmp(cpu.a, rd(absx())); break;
      case 0xd9: cmp(cpu.a, rd(absy())); break;
      case 0xc1: cmp(cpu.a, rd(indx())); break;
      case 0xd1: cmp(cpu.a, rd(indy())); break;
      case 0xe0: cmp(cpu.x, rd(imm())); break;
      case 0xe4: cmp(cpu.x, rd(zp())); break;
      case 0xec: cmp(cpu.x, rd(abs())); break;
      case 0xc0: cmp(cpu.y, rd(imm())); break;
      case 0xc4: cmp(cpu.y, rd(zp())); break;
      case 0xcc: cmp(cpu.y, rd(abs())); break;
      case 0x24: bit(rd(zp())); break;
      case 0x2c: bit(rd(abs())); break;
      // --- incrementi e decrementi
      case 0xe6: rmw(zp(), (v) => nz((v + 1) & 0xff)); break;
      case 0xf6: rmw(zpx(), (v) => nz((v + 1) & 0xff)); break;
      case 0xee: rmw(abs(), (v) => nz((v + 1) & 0xff)); break;
      case 0xfe: rmw(absx(), (v) => nz((v + 1) & 0xff)); break;
      case 0xc6: rmw(zp(), (v) => nz((v - 1) & 0xff)); break;
      case 0xd6: rmw(zpx(), (v) => nz((v - 1) & 0xff)); break;
      case 0xce: rmw(abs(), (v) => nz((v - 1) & 0xff)); break;
      case 0xde: rmw(absx(), (v) => nz((v - 1) & 0xff)); break;
      case 0xe8: cpu.x = nz((cpu.x + 1) & 0xff); break;
      case 0xca: cpu.x = nz((cpu.x - 1) & 0xff); break;
      case 0xc8: cpu.y = nz((cpu.y + 1) & 0xff); break;
      case 0x88: cpu.y = nz((cpu.y - 1) & 0xff); break;
      // --- scorrimenti e rotazioni
      case 0x0a: cpu.a = asl(cpu.a); break;
      case 0x06: rmw(zp(), asl); break;
      case 0x16: rmw(zpx(), asl); break;
      case 0x0e: rmw(abs(), asl); break;
      case 0x1e: rmw(absx(), asl); break;
      case 0x4a: cpu.a = lsr(cpu.a); break;
      case 0x46: rmw(zp(), lsr); break;
      case 0x56: rmw(zpx(), lsr); break;
      case 0x4e: rmw(abs(), lsr); break;
      case 0x5e: rmw(absx(), lsr); break;
      case 0x2a: cpu.a = rol(cpu.a); break;
      case 0x26: rmw(zp(), rol); break;
      case 0x36: rmw(zpx(), rol); break;
      case 0x2e: rmw(abs(), rol); break;
      case 0x3e: rmw(absx(), rol); break;
      case 0x6a: cpu.a = ror(cpu.a); break;
      case 0x66: rmw(zp(), ror); break;
      case 0x76: rmw(zpx(), ror); break;
      case 0x6e: rmw(abs(), ror); break;
      case 0x7e: rmw(absx(), ror); break;
      // --- salti
      case 0x4c: cpu.pc = word(cpu.pc); break;
      case 0x6c: cpu.pc = wrapWord(word(cpu.pc)); break;
      case 0x20: { const t = word(cpu.pc); const r = (cpu.pc + 1) & 0xffff; push(r >> 8); push(r); cpu.pc = t; break; }
      case 0x60: { const lo = pop(); const hi = pop(); cpu.pc = (((hi << 8) | lo) + 1) & 0xffff; break; }
      case 0x40: { cpu.p = pop() | B | U; const lo = pop(); const hi = pop(); cpu.pc = (hi << 8) | lo; break; }
      case 0x00: { const r = (cpu.pc + 1) & 0xffff; push(r >> 8); push(r); cpu.p |= B; push(cpu.p | B | U);
                   cpu.p |= I; cpu.pc = word(0xfffe); break; }
      case 0x10: branch(!(cpu.p & N)); break;
      case 0x30: branch(cpu.p & N); break;
      case 0x50: branch(!(cpu.p & V)); break;
      case 0x70: branch(cpu.p & V); break;
      case 0x90: branch(!(cpu.p & C)); break;
      case 0xb0: branch(cpu.p & C); break;
      case 0xd0: branch(!(cpu.p & Z)); break;
      case 0xf0: branch(cpu.p & Z); break;
      // --- flag
      case 0x18: cpu.p &= ~C; break;
      case 0x38: cpu.p |= C; break;
      case 0x58: cpu.p &= ~I; break;
      case 0x78: cpu.p |= I; break;
      case 0xb8: cpu.p &= ~V; break;
      case 0xd8: cpu.p &= ~D; break;
      case 0xf8: cpu.p |= D; break;
      case 0xea: break;
      default:   // istruzione non ufficiale: come py65, salta un byte e prosegue
        cpu.pc = (cpu.pc + 1) & 0xffff;
        cpu.unknown = (cpu.unknown || 0) + 1;
    }
  };

  cpu.push = push;
  return cpu;
}

if (typeof module !== "undefined") module.exports = { makeCPU };

window.makeCPU = makeCPU;
})();

<script>
// ---- machine.js
(function () {
// SCOTOGNO Soccer: la "macchina" minima che fa girare soccer.prg, con lo stesso modello dei collaudi in py65.
// - memoria piatta di 64 KB: i registri di VIC e SID sono byte dell'array, letti poi da disegno e audio;
// - letture speciali: $DC00 = joystick in porta 2 (PL1) AND valore scritto dal gioco (selezione colonne della
//   tastiera), $DC01 = joystick in porta 1 (PL2), tastiera sempre a riposo;
// - un passo = IRQ del raster (apply) + main loop fino all'attesa del fotogramma successivo.
// Niente orologio, niente casuale, niente browser: due copie con gli stessi tasti fanno la stessa partita.
"use strict";

const { makeCPU } = (typeof module !== "undefined") ? require("./cpu6502.js") : window;

const STEP_LIMIT = 2000000;          // istruzioni massime per passo (il gioco ne usa ~6000)

function makeMachine(prg, sym) {
  // prg: Uint8Array del file .prg (2 byte di indirizzo + dati); sym: { start, main, frame }
  const mem = new Uint8Array(65536);
  const io = { joy2: 0xff, joy1: 0xff };              // porta 2 = PL1, porta 1 = PL2 (attivi a 0)
  const hook = (ad) => {
    if (ad === 0xdc00) return io.joy2 & mem[0xdc00];
    if (ad === 0xdc01) return io.joy1;
    return -1;
  };
  // scritture nel SID del passo corrente: [cicli dall'inizio del passo, registro, valore] (solo se m.sidLog)
  const m = { mem, io, frames: 0, lastCycles: 0, sidLog: false, sidWrites: [] };
  let stepC0 = 0;
  const cpu = makeCPU(mem, hook, (reg, v) => { if (m.sidLog) m.sidWrites.push(cpu.cycles - stepC0, reg, v); });
  m.cpu = cpu;

  function runUntil(pred, what) {
    let n = 0;
    while (!pred()) {
      cpu.step();
      if (++n > STEP_LIMIT) throw new Error("limite di istruzioni superato (" + what + ", pc=" + cpu.pc.toString(16) + ")");
    }
  }

  m.boot = function () {
    mem.fill(0);
    io.joy2 = io.joy1 = 0xff;                         // joystick a riposo (prima restava l'ultimo tasto della partita)
    const load = prg[0] | (prg[1] << 8);
    mem.set(prg.subarray(2), load);
    mem[0x00] = 0x2f; mem[0x01] = 0x37;               // porta del processore dopo il reset
    mem[0xdc00] = 0xff; mem[0xdc01] = 0xff;
    cpu.a = cpu.x = cpu.y = 0; cpu.sp = 0xff; cpu.p = 0x30; cpu.cycles = 0;
    cpu.pc = sym.start;
    runUntil(() => cpu.pc === sym.main, "avvio");
    m.frames = 0;
  };

  // un fotogramma: joy1 = porta 1 (PL2), joy2 = porta 2 (PL1); byte del joystick, attivi a 0 (bit 0 su ... 4 fire)
  m.step = function (joy2, joy1) {
    io.joy2 = joy2 & 0xff; io.joy1 = joy1 & 0xff;
    const c0 = cpu.cycles;
    stepC0 = c0;
    m.sidWrites.length = 0;
    // IRQ come nei collaudi (fire_irq): PC e P (senza B) sulla pila, vettore in $FFFE, fino al ritorno
    const ret = cpu.pc, sp0 = cpu.sp;
    cpu.push(ret >> 8); cpu.push(ret & 0xff); cpu.push(cpu.p & ~0x10);
    cpu.pc = mem[0xfffe] | (mem[0xffff] << 8);
    runUntil(() => cpu.pc === ret && cpu.sp === sp0, "irq");
    // main loop fino all'attesa con il nuovo fotogramma pronto (frame = 0)
    runUntil(() => cpu.pc === sym.main && mem[sym.frame] === 0, "logic");
    m.lastCycles = cpu.cycles - c0;
    m.frames++;
  };

  // chiama una routine del gioco tra due fotogrammi (come call_sub di test_emu.py) e aspetta il suo RTS
  m.call = function (addr, a) {
    if (a !== undefined) cpu.a = a & 0xff;
    const r = (sym.main - 1) & 0xffff;
    cpu.push(r >> 8); cpu.push(r & 0xff);
    cpu.pc = addr;
    runUntil(() => cpu.pc === sym.main, "call " + addr.toString(16));
  };
  m.peek = (ad) => mem[ad];
  m.poke = (ad, v) => { mem[ad] = v & 0xff; };

  m.hash = function () {
    return crc32(mem, cpu);
  };

  m.save = function () {
    return { mem: mem.slice(), a: cpu.a, x: cpu.x, y: cpu.y, sp: cpu.sp, p: cpu.p, pc: cpu.pc, frames: m.frames };
  };
  m.load = function (s) {
    mem.set(s.mem); cpu.a = s.a; cpu.x = s.x; cpu.y = s.y; cpu.sp = s.sp; cpu.p = s.p; cpu.pc = s.pc;
    m.frames = s.frames;
  };
  return m;
}

// CRC-32 della memoria seguito dai registri (A, X, Y, SP, P, PCL, PCH): uguale a zlib.crc32 in Python
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(mem, cpu) {
  let c = 0xffffffff;
  for (let i = 0; i < mem.length; i++) c = CRC_T[(c ^ mem[i]) & 0xff] ^ (c >>> 8);
  for (const v of [cpu.a, cpu.x, cpu.y, cpu.sp, cpu.p, cpu.pc & 0xff, cpu.pc >> 8]) c = CRC_T[(c ^ v) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

if (typeof module !== "undefined") module.exports = { makeMachine, crc32 };

window.makeMachine = makeMachine;
window.crc32 = crc32;
})();
</script>
<script>
// ---- partenza.js
(function () {
// Partenza programmata della partita PL1 contro PL2: uguale a `programmata` di partenza_py65.py.
// Lingua con il fire sulla schermata della lingua, scelte scritte in memoria come le lascia `optchange`,
// presentazione (gotostate 8: sorteggio e copia dei cartelloni), poi `startmatch` con `cointeam` deciso dalla pagina.
"use strict";

const FIRE = 0x10, GSTATE = 0xa0, SELP = 0xa2, SELC = 0xa3, KICKMODE = 0xa4, WAIT_LIMIT = 600;

// nomi dei simboli di soccer.sym che servono qui (la pagina web li riceve insieme al .prg)
const SYMS_PARTENZA = ["start", "main", "lsel", "lbusy", "trans", "dq", "dn", "bbstep", "BB_STEPS", "gmode", "twop",
  "precup", "gotostate", "cointeam", "startmatch", "sprset", "sprtoggle", "sprstep", "spi", "spn", "field", "slmode",
  "abil", "pu_on", "copt", "bsel"];

// valori di base = quelli del gioco dopo l'avvio (BATTUTA: AREA, scivolata NORMALE e non quella nuova)
const SCELTE_BASE = { lang: 0, p1: 0, p2: 1, field: 0, kickmode: 1, slmode: 2, abil: 1, pu_on: 0, sprset: 0, copt: 0,
  bsel: 0, cointeam: 1 };

function avviaPartita(m, sym, scelte) {
  const c = Object.assign({}, SCELTE_BASE, scelte);
  const ready = () => m.peek(sym.trans) === 0 && m.peek(sym.lbusy) === 0 && m.peek(sym.dq) >= m.peek(sym.dn);
  const wait = (pred, what) => {
    for (let i = 0; i < WAIT_LIMIT; i++) { if (pred()) return; m.step(0xff, 0xff); }
    throw new Error("attesa troppo lunga: " + what);
  };
  m.boot();
  // lingua
  wait(() => m.peek(GSTATE) === 10 && ready(), "schermata della lingua");
  m.poke(sym.lsel, c.lang);
  m.step(0xff & ~FIRE, 0xff);
  m.step(0xff, 0xff);
  wait(() => m.peek(GSTATE) === 0 && ready(), "menu principale");
  // squadre e impostazioni
  m.poke(SELP, c.p1); m.poke(SELC, c.p2); m.poke(KICKMODE, c.kickmode);
  for (const k of ["field", "slmode", "abil", "pu_on", "copt", "bsel"]) m.poke(sym[k], c[k]);
  if (m.peek(sym.sprset) !== c.sprset) {
    m.call(sym.sprtoggle);
    while (m.peek(sym.spi) < m.peek(sym.spn)) m.call(sym.sprstep);
  }
  // presentazione, poi la partita
  m.poke(sym.gmode, 1); m.poke(sym.twop, 1); m.poke(sym.precup, 0);
  m.call(sym.gotostate, 8);
  wait(() => ready() && m.peek(sym.bbstep) >= sym.BB_STEPS, "presentazione");
  m.poke(sym.cointeam, c.cointeam);
  m.call(sym.startmatch);
}

if (typeof module !== "undefined") module.exports = { avviaPartita, SYMS_PARTENZA, SCELTE_BASE };

window.avviaPartita = avviaPartita;
window.SYMS_PARTENZA = SYMS_PARTENZA;
window.SCELTE_BASE = SCELTE_BASE;
})();
</script>
<script>
// ---- vic.js
(function () {
// Disegno di un fotogramma dai registri VIC e dalla memoria: il mini-VIC dei collaudi (soccer/test_emu.py, render)
// portato in JavaScript, con in piu' l'espansione orizzontale degli sprite multicolor.
// Cosa usa il gioco: modo testo a 24 righe (RSEL = 0), 40 colonne, caratteri multicolor o hires secondo la color RAM,
// scorrimento verticale fine ($D011), 8 sprite sempre davanti al fondo ($D01B = 0), bordo nero.
// Uscita: Uint32Array di 320 x 192 pixel in formato RGBA little-endian (per ImageData).
"use strict";

const W = 320, H = 192;
const PAL_RGB = [[0, 0, 0], [255, 255, 255], [136, 57, 50], [103, 182, 189], [139, 63, 150], [85, 160, 73],
  [64, 49, 141], [191, 206, 114], [139, 84, 41], [87, 66, 0], [184, 105, 98], [80, 80, 80], [120, 120, 120],
  [148, 224, 137], [120, 105, 196], [159, 159, 159]];
const PAL = PAL_RGB.map(([r, g, b]) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0);

function renderVIC(mem, out) {
  const d011 = mem[0xd011], d018 = mem[0xd018];
  const bg0 = PAL[mem[0xd021] & 15];
  if (!(d011 & 0x10)) { out.fill(bg0); return; }       // schermo spento (DEN = 0)
  const s = d011 & 7;
  const scr = ((d018 >> 4) & 15) * 0x400;
  const chb = ((d018 >> 1) & 7) * 0x800;
  const pal = [mem[0xd021] & 15, mem[0xd022] & 15, mem[0xd023] & 15, 0];
  for (let i = 0; i < H; i++) {
    const y = i + 7 - s, row = y >> 3, ln = y & 7, o = i * W;
    for (let col = 0; col < 40; col++) {
      const cell = row * 40 + col;
      const cram = mem[0xd800 + cell] & 15;
      const b = mem[(chb + mem[scr + cell] * 8 + ln) & 0xffff];
      const x0 = o + col * 8;
      if (cram & 8) {                                  // multicolor: "11" = color RAM (0-7)
        pal[3] = cram & 7;
        for (let k = 0; k < 4; k++) {
          const c = PAL[pal[(b >> (6 - 2 * k)) & 3]];
          out[x0 + 2 * k] = c; out[x0 + 2 * k + 1] = c;
        }
      } else {                                         // hires (testi dei menu)
        const fg = PAL[cram & 7];
        for (let k = 0; k < 8; k++) out[x0 + k] = (b >> (7 - k)) & 1 ? fg : bg0;
      }
    }
  }
  // sprite: dal 7 allo 0, cosi' i numeri piu' bassi stanno davanti
  const en = mem[0xd015], mc = mem[0xd01c], xe = mem[0xd01d], ye = mem[0xd017], xhi = mem[0xd010];
  for (let n = 7; n >= 0; n--) {
    if (!((en >> n) & 1)) continue;
    const ptr = mem[scr + 0x3f8 + n] * 64;
    const sx = mem[0xd000 + 2 * n] | (((xhi >> n) & 1) << 8);
    const sy = mem[0xd001 + 2 * n];
    const ex = (xe >> n) & 1 ? 2 : 1, ey = (ye >> n) & 1 ? 2 : 1;
    const colN = PAL[mem[0xd027 + n] & 15];
    const multi = (mc >> n) & 1;
    const sc = [0, PAL[mem[0xd025] & 15], colN, PAL[mem[0xd026] & 15]];
    for (let r = 0; r < 21; r++) {
      for (let bx = 0; bx < 3; bx++) {
        const b = mem[(ptr + r * 3 + bx) & 0xffff];
        if (!b) continue;
        for (let k = 0; k < 8; k++) {
          let c;
          if (multi) {
            const v = (b >> (6 - 2 * (k >> 1))) & 3;
            if (!v) continue;
            c = sc[v];
          } else {
            if (!((b >> (7 - k)) & 1)) continue;
            c = colN;
          }
          const px = sx - 24 + (bx * 8 + k) * ex;
          for (let dy = 0; dy < ey; dy++) {
            const Y = sy - 55 + r * ey + dy;
            if (Y < 0 || Y >= H) continue;
            for (let dx = 0; dx < ex; dx++) {
              const X = px + dx;
              if (X >= 0 && X < W) out[Y * W + X] = c;
            }
          }
        }
      }
    }
  }
}

if (typeof module !== "undefined") module.exports = { renderVIC, PAL_RGB, W, H };

window.renderVIC = renderVIC;
window.PAL_RGB = PAL_RGB;
})();

<script>
// ---- sid.js
(function () {
// SID semplificato per la pagina web: tre voci (triangolo, dente di sega, impulso, rumore, ring), inviluppo ADSR con le
// velocita' del SID vero, filtro a variabili di stato (passa-basso/banda/alto, risonanza), volume.
// Riceve le scritture nei registri con il loro istante e genera il suono in un AudioWorklet (o, se manca, in uno
// ScriptProcessor). Non tocca la partita: e' solo ascolto, e puo' essere approssimato.
"use strict";

// --- nucleo: lo stesso codice gira nell'AudioWorklet (copiato come testo) e nel ripiego ScriptProcessor
function SidCore(sampleRate) {
  const CLK = 985248;                                  // PAL
  const cps = CLK / sampleRate;                        // cicli del SID per campione
  const ATT = [9, 32, 63, 95, 149, 220, 267, 313, 392, 977, 1954, 3126, 3907, 11720, 19532, 31251];
  const reg = new Uint8Array(32);
  const v = [0, 1, 2].map(() => ({ acc: 0, prevMsb: 0, noise: 0x7ffff8, nbit: 0, env: 0, state: 3, cnt: 0, expCnt: 0, gate: 0 }));
  let lp = 0, bp = 0;
  const queue = [];                                    // [tempo in campioni, registro, valore]
  let now = 0;

  function write(r, val) {
    reg[r] = val;
    if (r % 7 === 4 && r < 21) {                       // controllo della voce: gate
      const vo = v[(r / 7) | 0], g = val & 1;
      if (g && !vo.gate) { vo.state = 0; }             // attacco
      else if (!g && vo.gate) { vo.state = 2; }        // rilascio
      vo.gate = g;
      if (val & 8) { vo.acc = 0; }                     // test

  function expPeriod(env) { return env >= 93 ? 1 : env >= 54 ? 2 : env >= 26 ? 4 : env >= 14 ? 8 : env >= 6 ? 16 : 30; }
  function envStep(vo, ad, sr) {
    // stati: 0 attacco, 1 decadimento/sostegno, 2 rilascio, 3 fermo
    let period;
    if (vo.state === 0) period = ATT[ad >> 4];
    else if (vo.state === 1) period = ATT[ad & 15] * 3;
    else period = ATT[sr & 15] * 3;

      if (vo.state === 0) {
        if (++vo.env >= 255) { vo.env = 255; vo.state = 1; }

      vo.acc = (vo.acc + freq * cps) % 16777216;

      const steps = Math.floor((old % 1048576 + freq * cps) / 1048576);

    if (ctrl & 0x10) {                                 // triangolo (ring: inverte con la voce precedente)
      let msb = acc >> 23;
      if (ctrl & 4) msb ^= v[(k + 2) % 3].acc >= 8388608 ? 1 : 0;
      const t = ((acc >> 11) & 0xfff) ^ (msb ? 0xfff : 0);
      out &= t; any = true;
    }
    if (ctrl & 0x20) { out &= acc >> 12; any = true; }
    if (ctrl & 0x40) { out &= (acc >> 12) >= pw ? 0xfff : 0; any = true; }
    if (ctrl & 0x80) {
      const n = vo.noise;
      const nv = (((n >> 20) & 1) << 11) | (((n >> 18) & 1) << 10) | (((n >> 14) & 1) << 9) | (((n >> 11) & 1) << 8) |
        (((n >> 9) & 1) << 7) | (((n >> 5) & 1) << 6) | (((n >> 2) & 1) << 5) | ((n & 1) << 4);
      out &= nv; any = true;
    }
    return any ? out - 2048 : 0;
  }

  // silenzio immediato: niente note in sospeso, voci ferme, volume a zero (a fine partita l'emulatore si ferma e il
  // SID resterebbe sull'ultima nota); la partita dopo riparte da sync() con i registri giusti
  this.silenzia = function () {
    queue.length = 0;
    reg[24] = 0;
    for (const vo of v) { vo.env = 0; vo.state = 3; vo.gate = 0; vo.cnt = 0; vo.expCnt = 0; }
    for (let k = 0; k < 3; k++) reg[k * 7 + 4] &= 0xfe;
    lp = 0; bp = 0;
  };
  this.post = function (events) {                     // events: [tempo in secondi audio, registro, valore, ...]
    for (let i = 0; i < events.length; i += 3) queue.push([Math.round(events[i] * sampleRate), events[i + 1], events[i + 2]]);
  };
  this.render = function (buf, startSample) {
    now = startSample;
    for (let i = 0; i < buf.length; i++, now++) {
      while (queue.length && queue[0][0] <= now) { const e = queue.shift(); write(e[1], e[2]); }

      const fc = (reg[21] & 7) | (reg[22] << 3);

      lp += f * bp;

      if (mode & 0x20) fo += bp;
      if (mode & 0x40) fo += hp;
      buf[i] = (direct + fo) * (mode & 15) / 15 / 6000;

// --- ponte con la pagina
const SID_WORKLET = `
${SidCore.toString()}
class SidProc extends AudioWorkletProcessor {
  constructor() {
    super();
    this.core = new SidCore(sampleRate);
    this.port.onmessage = (e) => { if (e.data && e.data.silenzia) this.core.silenzia(); else this.core.post(e.data); };
  }
  process(inputs, outputs) { const o = outputs[0][0]; this.core.render(o, currentFrame); for (let c = 1; c < outputs[0].length; c++) outputs[0][c].set(o); return true; }

registerProcessor("sid-proc", SidProc);
`;

function makeSidAudio() {
  // ritorna { start(): Promise, frame(writes, passiAlSecondo), stop() }; i tempi sono in secondi dell'AudioContext
  const A = { ctx: null, node: null, core: null, t: 0, ok: false };
  // non aspetta mai resume(): senza un gesto dell'utente (per esempio quando la partita parte da un messaggio della
  // rete) la promessa puo' restare in sospeso; il suono riparte da solo al primo gesto utile
  // piu' chiamate a start() mentre l'audio si sta ancora preparando aspettano tutte la stessa preparazione:
  // prima la seconda chiamata tornava subito, la partita partiva con l'audio non pronto e il volume iniziale del
  // gioco ($D418) non arrivava mai al SID (niente suono finche' non si spegneva e riaccendeva l'audio)
  A.start = function () {
    if (!A.preparazione) A.preparazione = prepara();
    return A.preparazione.then(() => { if (A.ctx) A.ctx.resume().catch(() => {}); });
  };
  async function prepara() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    A.ctx = new Ctx();
    try {
      const url = URL.createObjectURL(new Blob([SID_WORKLET], { type: "application/javascript" }));
      await A.ctx.audioWorklet.addModule(url);
      A.node = new AudioWorkletNode(A.ctx, "sid-proc", { outputChannelCount: [1] });
    } catch (e) {                                      // ripiego: ScriptProcessor nel thread principale
      A.core = new SidCore(A.ctx.sampleRate);
      A.node = A.ctx.createScriptProcessor(1024, 0, 1);
      A.node.onaudioprocess = (ev) => {
        A.core.render(ev.outputBuffer.getChannelData(0), Math.round(ev.playbackTime * A.ctx.sampleRate));
      };
    }
    A.node.connect(A.ctx.destination);
    A.ok = true;
  }
  // un passo dell'emulatore: le sue scritture nel SID (cicli, registro, valore) vanno suonate nel prossimo 1/50 s
  A.frame = function (writes, hz) {
    if (!A.ok) return;
    const now = A.ctx.currentTime;
    if (A.t < now + 0.02 || A.t > now + 0.3) A.t = now + 0.06;
    const ev = [];
    for (let i = 0; i < writes.length; i += 3) {
      ev.push(A.t + writes[i] / 985248, writes[i + 1], writes[i + 2]);
      if (writes[i + 1] === 24) A.volume = writes[i + 2] & 15;
    }
    A.t += 1 / hz;
    if (!ev.length) return;
    if (A.core) A.core.post(ev); else A.node.port.postMessage(ev);
  };
  // all'avvio della partita: lo stato attuale dei 25 registri (scritti prima, durante la partenza programmata)
  A.sync = function (mem) {
    if (!A.ok) return;
    A.t = A.ctx.currentTime + 0.06;
    const ev = [];
    for (let r = 0; r < 25; r++) ev.push(A.t, r, mem[0xd400 + r]);
    A.volume = mem[0xd418] & 15;
    if (A.core) A.core.post(ev); else A.node.port.postMessage(ev);
  };
  A.silenzia = function () {
    A.volume = 0;
    if (!A.ok) return;
    if (A.core) A.core.silenzia(); else A.node.port.postMessage({ silenzia: true });
    A.t = 0;
  };
  A.stop = function () { if (A.ctx) A.ctx.suspend(); };
  return A;
}

if (typeof module !== "undefined") module.exports = { SidCore };

window.SidCore = SidCore;
window.makeSidAudio = makeSidAudio;
})();

// Flusso SHA-256(sale + password + numero del blocco) in XOR; il testo in chiaro comincia con "SCOT".
// SHA-256 scritto qui (e non crypto.subtle) perche' funzioni anche aprendo il file dal disco.
"use strict";

function sha256(bytes) {

    0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);

}

function apriSegreti(DATI, pw) {
  const enc = new TextEncoder();
  const salt = b64(DATI.sale), blob = b64(DATI.segreti), p = enc.encode(pw.trim().toUpperCase());

    inp.set(salt); inp.set(p, salt.length);

    const ks = sha256(inp);

  if (!txt.startsWith("SCOT")) return null;

}


if (typeof module !== "undefined") module.exports = { sha256, apriSegreti };

window.sha256 = sha256;
window.apriSegreti = apriSegreti;
})();

<script>
// ---- rete.js
(function () {
// Collegamento diretto tra due browser (WebRTC), senza server: i "codici" si scambiano a mano.
// Generico, non sa niente del gioco: lo usa la pagina e si potra' riusare (seguito, Skunny Kart).
// Due canali sullo stesso collegamento:
//   "ctl": affidabile e ordinato, messaggi JSON (sala d'attesa, chat, partenza, controlli);
//   "inp": non affidabile e senza ordine, messaggi binari brevi (i tasti, gia' ridondanti).
// Codice = JSON (tipo, STUN, SDP) compresso (deflate-raw) in base64url, prefisso "SC1Z" o "SC1P".
"use strict";

const RETE_STUN = ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"];
const RETE_MAX_CODICE = 12000, RETE_MAX_CTL = 4000, RETE_RACCOLTA_MS = 6000;

function makeRete() {
  const R = {
    stato: "fermo",                                 // fermo, preparo, attesa, collegato, chiuso, errore
    stun: true, ruolo: null, pc: null, ctl: null, inp: null,
    indirizzi: { locali: 0, nascosti: 0, pubblici: 0 },
    // eventi (la pagina li sostituisce)
    onStato: () => {}, onMessaggio: () => {}, onTasti: () => {},
    // prove: perdita (0..1) e ritardo in ms dei pacchetti dei tasti in uscita
    simula: { perdita: 0, ritardo: 0, variabile: 0 },
  };
  const cambia = (s, dettaglio) => { R.stato = s; R.onStato(s, dettaglio || ""); };

  // ---- codici
  async function deflate(bytes) {
    if (typeof CompressionStream === "undefined") return null;
    const out = new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw")));
    return new Uint8Array(await out.arrayBuffer());
  }
  async function inflate(bytes) {
    const out = new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")));
    return new Uint8Array(await out.arrayBuffer());
  }
  const b64u = (b) => { let s = ""; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
  async function codifica(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    const z = await deflate(raw);
    return z ? "SC1Z" + b64u(z) : "SC1P" + b64u(raw);
  }
  async function decodifica(code, tipo) {
    code = (code || "").replace(/\s+/g, "");
    if (code.length < 10 || code.length > RETE_MAX_CODICE || !code.startsWith("SC1")) throw new Error("codice non valido");
    const body = unb64u(code.slice(4));
    const raw = code[3] === "Z" ? await inflate(body) : code[3] === "P" ? body : null;
    if (!raw || raw.length > 20000) throw new Error("codice non valido");
    const o = JSON.parse(new TextDecoder().decode(raw));
    if (!o || o.v !== 1 || o.t !== tipo || typeof o.sdp !== "string" || typeof o.stun !== "boolean")
      throw new Error(tipo === "o" ? "serve il codice di chi crea" : "serve il codice di risposta");
    return o;
  }

  // ---- collegamento
  function nuovo(stun) {
    R.stun = stun;
    R.indirizzi = { locali: 0, nascosti: 0, pubblici: 0 };
    const pc = new RTCPeerConnection({ iceServers: stun ? [{ urls: RETE_STUN }] : [] });
    R.pc = pc;
    pc.onicecandidate = (e) => {
      if (!e.candidate) return;
      const c = e.candidate, typ = c.type || (/ typ (\w+)/.exec(c.candidate) || [])[1];
      const addr = c.address || c.candidate.split(" ")[4] || "";
      if (typ === "host") { if (addr.endsWith(".local")) R.indirizzi.nascosti++; else R.indirizzi.locali++; }
      else if (typ === "srflx") R.indirizzi.pubblici++;

    pc.onconnectionstatechange = () => {
      if (pc !== R.pc) return;
      if (pc.connectionState === "failed") cambia("errore", "collegamento non riuscito");
      if (pc.connectionState === "disconnected" && R.stato === "collegato") cambia("collegato", "interrotto?");
      if (pc.connectionState === "closed") cambia("chiuso");
    };
    pc.ondatachannel = (e) => canale(e.channel);
    return pc;
  }
  function canale(ch) {
    ch.binaryType = "arraybuffer";
    if (ch.label === "ctl") {
      R.ctl = ch;
      ch.onmessage = (e) => {
        if (typeof e.data !== "string" || e.data.length > RETE_MAX_CTL) return;
        let o; try { o = JSON.parse(e.data); } catch (x) { return; }
        if (o && typeof o.t === "string") R.onMessaggio(o);
      };
      ch.onclose = () => { if (R.stato !== "fermo") cambia("chiuso"); };
    } else if (ch.label === "inp") {
      R.inp = ch;
      ch.onmessage = (e) => { if (e.data instanceof ArrayBuffer && e.data.byteLength <= 512) R.onTasti(e.data); };
    }
    ch.onopen = () => { if (R.ctl && R.inp && R.ctl.readyState === "open" && R.inp.readyState === "open") cambia("collegato"); };
    if (ch.readyState === "open") ch.onopen();
  }
  async function raccogli() {
    const pc = R.pc;
    if (pc.iceGatheringState === "complete") return;
    await new Promise((ok) => {
      const t = setTimeout(ok, RETE_RACCOLTA_MS);
      pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); ok(); } });
    });
  }

  // chi crea: ritorna il codice da mandare
  R.crea = async function (stun) {
    R.chiudi();
    R.ruolo = "crea";
    cambia("preparo");
    const pc = nuovo(stun);
    canale(pc.createDataChannel("ctl", { ordered: true }));
    canale(pc.createDataChannel("inp", { ordered: false, maxRetransmits: 0 }));
    await pc.setLocalDescription(await pc.createOffer());
    await raccogli();
    cambia("attesa");
    return codifica({ v: 1, t: "o", stun, sdp: pc.localDescription.sdp });
  };
  // chi entra: dal codice ricevuto, ritorna il codice di risposta
  R.rispondi = async function (codice) {
    const o = await decodifica(codice, "o");
    R.chiudi();
    R.ruolo = "entra";
    cambia("preparo");
    const pc = nuovo(o.stun);
    await pc.setRemoteDescription({ type: "offer", sdp: o.sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await raccogli();
    cambia("attesa");
    return codifica({ v: 1, t: "a", stun: o.stun, sdp: pc.localDescription.sdp });
  };
  // chi crea: incolla la risposta
  R.collega = async function (codice) {
    const a = await decodifica(codice, "a");
    await R.pc.setRemoteDescription({ type: "answer", sdp: a.sdp });
  };
  R.manda = function (obj) {
    if (R.ctl && R.ctl.readyState === "open") R.ctl.send(JSON.stringify(obj));
  };
  R.mandaTasti = function (buf) {
    if (!R.inp || R.inp.readyState !== "open") return;
    const s = R.simula;
    if (s.perdita && Math.random() < s.perdita) return;
    if (s.ritardo || s.variabile) {
      const ch = R.inp;
      setTimeout(() => { if (ch.readyState === "open") ch.send(buf); }, s.ritardo + Math.random() * s.variabile);
    } else R.inp.send(buf);
  };
  // tipo di collegamento scelto (per la sala d'attesa): "stessa rete", "internet", "inoltro"
  R.tipo = async function () {
    try {
      const st = await R.pc.getStats();

<script>
// ---- lockstep.js
(function () {
// Gioco in rete "a passi uguali" (lockstep) con ritardo dei comandi: generico, non sa niente del gioco.
// Ogni giocatore ha un posto (0 o 1). Il tasto premuto quando la partita e' al passo f vale al passo f + D:
// cosi' ha D passi di tempo (D * 20 ms) per arrivare all'altro. Un passo si esegue solo quando si hanno i tasti di
// tutti e due; se manca quello dell'altro si aspetta.
// Pacchetti dei tasti (canale non affidabile): ogni volta si rimandano tutti i tasti non ancora confermati
// dall'altro, quindi un pacchetto perso non conta. Formato: [1, conferma u32, primo u32, n u8, n tasti].
// Ogni OGNI_HASH passi i due si mandano l'hash dello stato (canale affidabile) e lo confrontano.
"use strict";

const LS_NEUTRO = 0xff, LS_MAX_INVIO = 120, LS_OGNI_HASH = 60;

function makeLockstep(o) {
  // o: { posto: 0|1, ritardo: D, passo(t0, t1), hash(), mandaTasti(ArrayBuffer), mandaCtl(obj), onDesync(f, mio, suo) }
  const D = o.ritardo;
  const tasti = [new Map(), new Map()];             // passo -> tasto, per posto
  const io = o.posto, lui = 1 - o.posto;
  const S = {
    f: 0,                                           // passi eseguiti
    mioProssimo: D,                                 // primo passo a cui assegnare il prossimo tasto locale
    suoContiguo: D,                                 // primo passo di cui manca ancora il tasto dell'altro
    suoMax: D - 1,                                  // passo piu' alto ricevuto dall'altro
    confermatoDaLui: D,                             // primo passo dei miei che lui non ha ancora
    attese: 0, desync: false,
  };
  for (let k = 0; k < D; k++) { tasti[0].set(k, LS_NEUTRO); tasti[1].set(k, LS_NEUTRO); }
  const hashMiei = new Map(), hashSuoi = new Map();

  function invia() {
    const da = Math.max(S.confermatoDaLui, S.mioProssimo - LS_MAX_INVIO);
    const n = S.mioProssimo - da;
    const buf = new ArrayBuffer(10 + n), dv = new DataView(buf);
    dv.setUint8(0, 1); dv.setUint32(1, S.suoContiguo); dv.setUint32(5, da); dv.setUint8(9, n);
    for (let i = 0; i < n; i++) dv.setUint8(10 + i, tasti[io].get(da + i));
    o.mandaTasti(buf);
  }
  function controlla(f) {
    if (!hashMiei.has(f) || !hashSuoi.has(f)) return;
    if (hashMiei.get(f) !== hashSuoi.get(f) && !S.desync) { S.desync = true; o.onDesync(f, hashMiei.get(f), hashSuoi.get(f)); }
    hashMiei.delete(f); hashSuoi.delete(f);
  }

  // un "battito" del tempo locale: registra il tasto locale (se c'e' posto) e prova a eseguire un passo
  S.battito = function (tastoLocale) {
    if (S.desync) return false;
    if (S.mioProssimo <= S.f + D) tasti[io].set(S.mioProssimo++, tastoLocale & 0xff);
    invia();
    if (!tasti[lui].has(S.f)) { S.attese++; return false; }
    const t = [tasti[0].get(S.f), tasti[1].get(S.f)];
    o.passo(t[0], t[1]);
    tasti[lui].delete(S.f - 1);                     // i miei si tengono finche' lui non li conferma (vedi invia)
    if (S.f - 1 < S.confermatoDaLui) tasti[io].delete(S.f - 1);
    S.f++;
    if (S.f % LS_OGNI_HASH === 0) {
      const h = o.hash();
      hashMiei.set(S.f, h);
      o.mandaCtl({ t: "hash", f: S.f, h });
      controlla(S.f);
    }
    return true;
  };
  // dopo la fine della partita: continuare a rimandare i tasti per un po', se all'altro ne manca qualcuno
  S.invia = invia;
  // quanti passi l'altro e' avanti (per recuperare se si resta indietro)
  S.indietro = () => S.suoMax - (S.f + D);

  S.riceviTasti = function (buf) {
    if (buf.byteLength < 10) return;
    const dv = new DataView(buf);
    if (dv.getUint8(0) !== 1) return;
    const conf = dv.getUint32(1), da = dv.getUint32(5), n = dv.getUint8(9);
    if (buf.byteLength !== 10 + n) return;
    if (conf > S.confermatoDaLui && conf <= S.mioProssimo) {
      for (let k = S.confermatoDaLui; k < conf; k++) if (k < S.f) tasti[io].delete(k);
      S.confermatoDaLui = conf;
    }
    for (let i = 0; i < n; i++) {
      const k = da + i;
      if (k >= S.f && !tasti[lui].has(k) && k < S.f + 4 * D + 400) tasti[lui].set(k, dv.getUint8(10 + i));
      if (k > S.suoMax) S.suoMax = k;
    }
    while (tasti[lui].has(S.suoContiguo)) S.suoContiguo++;
  };
  S.riceviHash = function (m) {
    if (typeof m.f !== "number" || typeof m.h !== "number") return;
    hashSuoi.set(m.f, m.h);
    controlla(m.f);
  };
  return S;
}

if (typeof module !== "undefined") module.exports = { makeLockstep, LS_NEUTRO };

window.makeLockstep = makeLockstep;
})();
</script>

  // ------------------------------------------------------------------ comandi
  const tasti = new Set();

  let toccoBits = 0, toccoFire = 0;
  function bits(mappa, pad) {
    let b = 0;

      const ax = pad.axes || [], bt = pad.buttons || [];
      const p = (i) => bt[i] && bt[i].pressed;
      if ((ax[1] || 0) < -0.5 || p(12)) b |= 1;
      if ((ax[1] || 0) > 0.5 || p(13)) b |= 2;
      if ((ax[0] || 0) < -0.5 || p(14)) b |= 4;
      if ((ax[0] || 0) > 0.5 || p(15)) b |= 8;

  function croce() {

      for (const t of e.touches) {

  // ------------------------------------------------------------------ emulatore e ciclo

    if (audioSi) sid.start().catch(() => {});        // il gesto dell'utente serve a far partire l'audio
    if (modo === "locale") { gioca(false); return; }
    if (!ON.collegato) return;
    const i = ON.ruolo === "crea" ? 0 : 1;
    ON.pronti[i] = !ON.pronti[i];
    if (ON.ruolo === "crea") { mandaSala(); provaVia(); } else rete.manda({ t: "pronto", v: ON.pronti[1] });
    if (!inGioco) disegnaSala();
  };
  $("bEsci").onclick = esci;
  $("bAudio").onclick = async () => {
    audioSi = !audioSi; salva("audio", audioSi);
    if (audioSi) { await sid.start(); sid.sync(m.mem); } else sid.stop();
    $("bAudio").textContent = audioSi ? tt("audioSi") : tt("audioNo");
  };
  $("bFull").onclick = () => { const s = $("schermo"); (s.requestFullscreen || s.webkitRequestFullscreen || (() => {})).call(s); };
  $("bPw").onclick = () => provaPassword($("pw").value, false);
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") provaPassword($("pw").value, false); });
  $("bChat").onclick = mandaChat;
  $("nome").value = mioNome;
  let nomeTimer = null;
  $("nome").addEventListener("input", () => {
    clearTimeout(nomeTimer);
    nomeTimer = setTimeout(() => {
      mioNome = pulisciNome($("nome").value);
      salva("nome", mioNome);
      if (ON.collegato) rete.manda({ t: "nome", n: mioNome });
      if (!inGioco) disegnaSala();
    }, 400);
  });
  $("sChat").onchange = () => { chatPos = $("sChat").value; salva("chatPos", chatPos); disponiChat(); };
  $("chatIn").addEventListener("keydown", (e) => { if (e.key === "Enter") mandaChat(); });
  const errRete = (e) => { $("statoRete").textContent = tt("errore") + e.message; $("statoRete").className = "nota err"; };
  $("bCrea").onclick = async () => { try { $("tOffer").value = await rete.crea($("stun").checked); } catch (e) { errRete(e); } };
  $("bCollega").onclick = async () => { try { await rete.collega($("tAnswerIn").value); } catch (e) { errRete(e); } };
  $("bRisp").onclick = async () => { try { $("tAnswer").value = await rete.rispondi($("tOfferIn").value); } catch (e) { errRete(e); } };
  const copia = async (id) => {
    const t = $(id);
    try { await navigator.clipboard.writeText(t.value); } catch (e) { t.removeAttribute("readonly"); t.select(); document.execCommand("copy"); t.setAttribute("readonly", ""); }
  };
  const condividi = async (id) => {
    if (navigator.share) { try { await navigator.share({ text: $(id).value }); return; } catch (e) { if (e.name === "AbortError") return; } }
    copia(id);
  };
  $("cOffer").onclick = () => copia("tOffer");
  $("cAnswer").onclick = () => copia("tAnswer");
  $("sOffer").onclick = () => condividi("tOffer");
  $("sAnswer").onclick = () => condividi("tAnswer");
  $("bScambia").onclick = () => {
    if (ON.ruolo !== "crea") return;
    ON.hostPL = 3 - ON.hostPL; ON.sq = [ON.sq[1], ON.sq[0]]; ON.pronti = [false, false];
    mandaSala(); disegnaSala();
  };
  $("bScollega").onclick = () => { rete.chiudi(); ON.collegato = false; disegnaSala(); };

  // errori imprevisti: si mostrano invece di bloccare la pagina in silenzio
  addEventListener("unhandledrejection", (e) => {
    if (inGioco) sopra(`<div class="grande err">${tt("errore")}</div><div>${esc(e.reason && e.reason.message || e.reason)}</div>
      <div style="margin-top:12px"><button class="sec" id="bSala">${tt("torna")}</button></div>`);
    const b = $("bSala"); if (b) b.onclick = esci;
  });

  // ------------------------------------------------------------------ avvio della pagina
  if ("ontouchstart" in window || (window.matchMedia && matchMedia("(pointer: coarse)").matches)) $("tocco").classList.remove("hide");
  croce();
  requestAnimationFrame(ciclo);
  const pw = leggi("password", "");
  if (pw) provaPassword(pw, true);
  disegnaSala();
  // per le prove automatiche e per curiosare dalla console
  window.SCOTOGNO = { m, scelte, ON, rete, sid, gioca, esci,
    avanti: (n) => { for (let i = 0; i < n && !finito; i++) passoLocale(); disegna(); },
    veloce: (k) => { PERIODO = 1000 / HZ / k; },
    stato: () => ({ inGioco, attivo, finito, online: partitaOnline, gstate: m.mem[GSTATE], frames: m.frames, segreti: !!segreti,
      passi: ls ? ls.f : 0, attese: ls ? ls.attese : 0, desync: ls ? ls.desync : false, hash: m.hash(),
      punti: [m.mem[SCOREP], m.mem[SCOREO]] }) };
})();

</script>
</body>
</html>
