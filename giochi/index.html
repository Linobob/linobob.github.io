<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giochi finiti in live · Linobob</title>
<meta name="description" content="Tutti i giochi completati in diretta su Twitch, con piattaforma, durata e video.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 9c-7 0-11 5-11 11s5 9 11 9 11-3 11-9-4-11-11-11z' fill='%23F7A072'/%3E%3Cpath d='M16 10c-2 3-2 8 0 12' stroke='%23E07A5F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 9c1-4 5-6 9-5-1 4-5 6-9 5z' fill='%236E9A5B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,0,0;9..144,700,0,0&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/base.css">
<style>
.wrap { max-width: 62rem; }

/* Intestazione con totali e grafico per anno (che funziona anche da filtro) */
.head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 21rem); gap: 2rem 3rem; align-items: end; padding-top: 2.5rem; }
h1 { font-size: clamp(2.4rem, 9vw, 3.8rem); line-height: 1; }
.lead { margin-top: 1rem; color: var(--muted); font-size: 1.05rem; }
.stats { display: flex; flex-wrap: wrap; gap: 1.1rem 2.4rem; margin: 1.6rem 0 0; }
.stat b { display: block; font: 700 2.1rem/1 var(--display); font-variation-settings: "SOFT" 0, "WONK" 0; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 0.4rem; }
.last { margin: 1.1rem 0 0; font: 400 0.85rem var(--mono); }
.chart-label { margin: 0 0 0.6rem; }
.years { display: flex; align-items: flex-end; gap: 0.5rem; }
.years button {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 0.3rem;
  background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer; text-align: center;
  font: 500 0.8rem var(--mono);
}
.years .n { font-variant-numeric: tabular-nums; }
.years .bar { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; transition: background-color 0.15s; }
.years[data-sel] button:not([aria-pressed="true"]) .bar { background: var(--bar); }
.years button:hover .bar { background: var(--accent); }
.years button[aria-pressed="true"] .y { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.years .y { padding-bottom: 0.15rem; }

/* Ricerca, ordinamento, piattaforme */
.tools { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 2.4rem; }
.tools input, .tools select {
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 0.6rem 0.8rem; font-size: 16px; min-height: 46px;
}
.tools input { flex: 1 1 14rem; min-width: 0; }
.tools select { flex: 0 1 12rem; min-width: 0; }
.tools input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 0.45rem; margin-top: 0.9rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: thin; }
.chip {
  flex: none; white-space: nowrap; cursor: pointer;
  background: transparent; color: var(--fg);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 0.3rem 0.8rem; font-size: 0.9rem; min-height: 36px;
}
.chip i { font: 400 0.8rem var(--mono); font-style: normal; color: var(--muted); margin-left: 0.35rem; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] i { color: inherit; opacity: 0.85; }
@media (min-width: 761px) { .chips { flex-wrap: wrap; overflow: visible; } }

/* Registro: una riga per gioco (data, titolo e nota, piattaforma, durata, video) */
.sum {
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  margin-top: 1.4rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--fg);
  font: 500 0.85rem var(--mono);
}
.sum button, .empty button { background: none; border: 0; padding: 0.25rem 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font: inherit; }
.log { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid;
  grid-template-columns: 6.6rem minmax(0, 1fr) 9.5rem 5.4rem minmax(5.5rem, auto);
  grid-template-areas: "d t p u l";
  gap: 0.35rem 1.1rem; align-items: center;
  padding: 1rem 0; border-bottom: 1px solid var(--line);
}
.d { grid-area: d; font: 400 0.875rem var(--mono); font-variant-numeric: tabular-nums; }
.t { grid-area: t; min-width: 0; font: 600 1.05rem/1.35 var(--body); overflow-wrap: anywhere; }
.note { display: inline-block; margin-left: 0.5rem; padding: 0.05rem 0.45rem; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font: 500 0.8rem/1.5 var(--mono); vertical-align: 0.08em; overflow-wrap: anywhere; }
.p { grid-area: p; font-size: 0.95rem; color: var(--muted); min-width: 0; }
.u { grid-area: u; text-align: right; font: 400 0.875rem var(--mono); font-variant-numeric: tabular-nums; }
.l { grid-area: l; display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: flex-end; }
.parts { display: inline-flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; justify-content: flex-end; }
.plabel { font: 400 0.8rem var(--mono); color: var(--muted); margin-right: 0.15rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 36px; min-width: 36px; padding: 0 0.8rem;
  border: 1px solid var(--accent); border-radius: 6px;
  color: var(--accent); text-decoration: none; font: 500 0.85rem var(--mono);
}
.btn:hover { background: var(--accent); color: var(--accent-ink); }
.parts .btn { padding: 0 0.45rem; }
.nolink { font: 400 0.85rem var(--mono); color: var(--muted); }
.empty { padding: 2.5rem 0; color: var(--muted); }

/* Telefono: ogni gioco è una scheda separata */
@media (max-width: 760px) {
  .head { grid-template-columns: minmax(0, 1fr); }
  .sum { border-bottom: 0; padding-bottom: 0; }
  .log { display: grid; gap: 0.7rem; margin-top: 0.8rem; }
  .row {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "t t t" "d p u" "l l l";
    align-items: baseline; gap: 0.5rem 0.8rem;
    padding: 0.9rem 1rem; border: 1px solid var(--line); border-left: 4px solid var(--peach); border-radius: 10px;
  }
  .l, .parts { justify-content: flex-start; }
  .l { margin-top: 0.2rem; }
}
@media (prefers-reduced-motion: reduce) { .years .bar { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="../">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 9c-7 0-11 5-11 11s5 9 11 9 11-3 11-9-4-11-11-11z" fill="var(--peach)"/>
        <path d="M16 10c-2 3-2 8 0 12" stroke="var(--peach-deep)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M16 9c1-4 5-6 9-5-1 4-5 6-9 5z" fill="var(--leaf)"/>
      </svg>
      Linobob
    </a>
    <nav aria-label="Sito">
      <a href="./" aria-current="page">Giochi finiti</a>
      <a href="https://www.twitch.tv/lino_bob" target="_blank" rel="noopener">twitch.tv/lino_bob</a>
    </nav>
  </div>

  <header class="head">
    <div>
      <p class="kicker">Registro delle live</p>
      <h1>Giochi finiti in live</h1>
      <p class="lead">Ogni gioco completato in diretta su Twitch, con il video della partita.</p>
      <dl class="stats" id="stats"></dl>
      <p class="last" id="last"></p>
    </div>
    <div>
      <p class="label chart-label" id="chart-label">Giochi per anno</p>
      <div class="years" id="years" role="group" aria-labelledby="chart-label"></div>
    </div>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="Cerca un gioco, una piattaforma, una nota" aria-label="Cerca" autocomplete="off">
    <select id="ord" aria-label="Ordina">
      <option value="recenti">Più recenti</option>
      <option value="vecchi">Meno recenti</option>
      <option value="lunghi">Più lunghi</option>
      <option value="brevi">Più brevi</option>
      <option value="titolo">Titolo A-Z</option>
    </select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Piattaforma"></div>

  <div class="sum">
    <span id="sum" aria-live="polite">Caricamento della lista…</span>
    <button id="reset" type="button" hidden>Azzera filtri</button>
  </div>
  <ul class="log" id="list"></ul>

  <footer class="foot">
    <a href="../">Torna alla home</a>
  </footer>
</div>

<script>
/* I dati stanno in giochi.json, nella stessa cartella. Questa pagina non va modificata
   per aggiungere un gioco: basta aggiungere una voce al file JSON. */
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // "1h 4m 22s" -> secondi; stringa vuota -> null
  function parseDurata(s) {
    if (!s) return null;
    const m = /^\s*(?:(\d+)h)?\s*(?:(\d+)m)?\s*(?:(\d+)s)?\s*$/.exec(s);
    if (!m || !(m[1] || m[2] || m[3])) return null;
    return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  }
  const fmtData = iso => { const p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  const fmtDur = s => {
    if (s == null) return '—';
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    if (h) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    return s < 600 ? m + 'm ' + String(sec).padStart(2, '0') + 's' : m + 'm';
  };
  const fmtTot = s => Math.floor(s / 3600) + ' h ' + Math.round(s % 3600 / 60) + ' min';
  const isPlaylist = u => /[?&]list=|\/playlist/.test(u);

  const sorters = {
    recenti: (a, b) => b.data.localeCompare(a.data) || b.i - a.i,
    vecchi: (a, b) => a.data.localeCompare(b.data) || a.i - b.i,
    lunghi: (a, b) => (b.sec || 0) - (a.sec || 0),
    brevi: (a, b) => (a.sec == null) - (b.sec == null) || (a.sec || 0) - (b.sec || 0),
    titolo: (a, b) => a.titolo.localeCompare(b.titolo, 'it', { sensitivity: 'base' })
  };

  function start(DATA) {
    const nomi = new Map(DATA.piattaforme.map(p => [p.sigla, p.nome]));
    const games = DATA.giochi.map((g, i) => Object.assign({}, g, {
      i,
      link: g.link || [],
      sec: parseDurata(g.durata),
      anno: g.data.slice(0, 4),
      chiave: norm([g.titolo, g.nota || '', g.piattaforma, nomi.get(g.piattaforma) || ''].join(' '))
    }));
    const state = { q: '', plat: '', anno: '', ord: 'recenti' };

    const totSec = games.reduce((t, g) => t + (g.sec || 0), 0);
    const piattUsate = new Set(games.map(g => g.piattaforma));
    $('stats').innerHTML =
      '<div class="stat"><b>' + games.length + '</b><span class="label">giochi</span></div>' +
      '<div class="stat"><b>' + Math.round(totSec / 3600) + '</b><span class="label">ore di live</span></div>' +
      '<div class="stat"><b>' + piattUsate.size + '</b><span class="label">piattaforme</span></div>';
    const ultimo = games.reduce((a, g) => g.data > a ? g.data : a, '');
    if (ultimo) $('last').textContent = 'Ultimo gioco finito il ' + fmtData(ultimo);

    const perAnno = {};
    games.forEach(g => { perAnno[g.anno] = (perAnno[g.anno] || 0) + 1; });
    const anni = Object.keys(perAnno).sort();
    const maxAnno = Math.max.apply(null, anni.map(a => perAnno[a]));
    $('years').innerHTML = anni.map(a =>
      '<button type="button" data-y="' + a + '" aria-pressed="false" aria-label="' + a + ': ' + perAnno[a] + ' giochi">' +
      '<span class="n">' + perAnno[a] + '</span>' +
      '<span class="bar" style="height:' + Math.max(4, Math.round(perAnno[a] / maxAnno * 84)) + 'px"></span>' +
      '<span class="y">' + a + '</span></button>'
    ).join('');

    const perPlat = {};
    games.forEach(g => { perPlat[g.piattaforma] = (perPlat[g.piattaforma] || 0) + 1; });
    const ordPlat = Object.keys(perPlat).sort((a, b) => perPlat[b] - perPlat[a]);
    const chip = (val, label, n) =>
      '<button type="button" class="chip" data-p="' + esc(val) + '" aria-pressed="false">' + esc(label) + '<i>' + n + '</i></button>';
    $('chips').innerHTML = chip('', 'Tutte', games.length) + ordPlat.map(s => chip(s, nomi.get(s) || s, perPlat[s])).join('');

    function linksHtml(g) {
      if (!g.link.length) return '<span class="nolink">nessun video</span>';
      if (g.link.length === 1) {
        const u = g.link[0];
        return '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener" aria-label="Guarda ' + esc(g.titolo) + '">' + (isPlaylist(u) ? 'Playlist' : 'Guarda') + '</a>';
      }
      return '<span class="parts"><span class="plabel">Parti</span>' + g.link.map((u, k) =>
        '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener" aria-label="Guarda ' + esc(g.titolo) + ', ' + (isPlaylist(u) ? 'playlist' : 'parte ' + (k + 1)) + '">' + (isPlaylist(u) ? 'Playlist' : (k + 1)) + '</a>'
      ).join('') + '</span>';
    }
    const rowHtml = g => '<li class="row">' +
      '<span class="d">' + fmtData(g.data) + '</span>' +
      '<span class="t">' + esc(g.titolo) + (g.nota ? '<span class="note">' + esc(g.nota) + '</span>' : '') + '</span>' +
      '<span class="p">' + esc(nomi.get(g.piattaforma) || g.piattaforma) + '</span>' +
      '<span class="u">' + fmtDur(g.sec) + '</span>' +
      '<span class="l">' + linksHtml(g) + '</span></li>';

    function update() {
      const terms = norm(state.q).split(/\s+/).filter(Boolean);
      const res = games.filter(g =>
        (!state.plat || g.piattaforma === state.plat) &&
        (!state.anno || g.anno === state.anno) &&
        terms.every(t => g.chiave.indexOf(t) !== -1)
      ).sort(sorters[state.ord]);

      $('list').innerHTML = res.length
        ? res.map(rowHtml).join('')
        : '<li class="empty">Nessun gioco corrisponde a questa ricerca. <button type="button" data-reset>Azzera i filtri</button></li>';
      const tot = res.reduce((t, g) => t + (g.sec || 0), 0);
      $('sum').textContent = res.length + (res.length === 1 ? ' gioco' : ' giochi') + ' · ' + fmtTot(tot);
      $('reset').hidden = !(state.q || state.plat || state.anno);
      document.querySelectorAll('#chips .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === state.plat)));
      document.querySelectorAll('#years button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.y === state.anno)));
      $('years').toggleAttribute('data-sel', !!state.anno);
    }
    function azzera() { state.q = ''; state.plat = ''; state.anno = ''; $('q').value = ''; update(); }

    $('q').addEventListener('input', e => { state.q = e.target.value; update(); });
    $('ord').addEventListener('change', e => { state.ord = e.target.value; update(); });
    $('chips').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b) { state.plat = b.dataset.p; update(); } });
    $('years').addEventListener('click', e => { const b = e.target.closest('button[data-y]'); if (b) { state.anno = state.anno === b.dataset.y ? '' : b.dataset.y; update(); } });
    $('reset').addEventListener('click', azzera);
    $('list').addEventListener('click', e => { if (e.target.closest('[data-reset]')) azzera(); });
    update();
  }

  fetch('giochi.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(start)
    .catch(err => {
      $('sum').textContent = 'Non riesco a caricare la lista dei giochi (' + err.message + ').';
      if (location.protocol === 'file:') {
        $('list').innerHTML = '<li class="empty">Aperta come file locale, la pagina non può leggere giochi.json. Avvia un server nella cartella del sito con <code>python3 -m http.server</code> e apri http://localhost:8000/giochi/.</li>';
      }
    });
})();
</script>
</body>
</html>
